[package]
name = "l8db-extension"
version = "0.1.0"
description = "Write l8db extensions in Rust."
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/Leon-Achteresch/l8db"

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt", "rt-multi-thread", "sync", "time"] }
