[package]
name = "hello-rust-extension"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[[bin]]
name = "hello-rust-extension"
path = "src/main.rs"

[dependencies]
l8db-extension = { path = "../../packages/extension-sdk-rs" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "io-util"] }
